# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Mod properties
mod_version=1.1
maven_group=work.penguinnet
archives_name=ResticRestorer
# Bundled restic binary (downloaded + checksum-verified at build time, shipped as a jar resource so the mod
# can run without restic installed; set restic.binary="bundled" in resticrestorer.json to use it). Bump this
# to update restic; the build fails fast if the version/artifact doesn't exist upstream.
restic_version=0.19.0

# Minecraft-independent dependencies.
fabric_loader_version=0.18.4

# --- Supported Minecraft versions -------------------------------------------------------------------------
# Every Minecraft-dependent key is suffixed with its version group; there is deliberately no unsuffixed
# "default" version. Adding a version means adding a block here plus one row in root build.gradle's
# `mcVersions` table.

# 1.20.1 (Fabric + Forge)
minecraft_version_1201=1.20.1
architectury_api_version_1201=9.2.14
fabric_api_version_1201=0.92.9+1.20.1
fabric_permissions_version_1201=0.3.1
forge_version_1201=1.20.1-47.4.20

# 1.21.1 (Fabric + NeoForge)
minecraft_version_1211=1.21.1
architectury_api_version_1211=13.0.8
fabric_api_version_1211=0.116.13+1.21.1
fabric_permissions_version_1211=0.3.1
neoforge_version_1211=21.1.235
