architectury {
    common 'fabric', 'neoforge'
}

loom {
    accessWidenerPath = file("src/main/resources/resticrestorer.accesswidener")
}

dependencies {
    // Fabric Loader here only for the @Environment annotations, remapped per platform. Don't use other classes.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version_1211"

    // :core is plain Java (no Minecraft types) — implementation so the dev runtime sees it.
    implementation project(':core')
}
