name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: |
          ARGS=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ARGS="-Pmod_version=${GITHUB_REF_NAME#v}"
          fi
          ./gradlew build --stacktrace $ARGS

      - name: Upload Fabric 1.20.1 jar
        uses: actions/upload-artifact@v7
        with:
          name: resticrestorer-fabric-1.20.1
          if-no-files-found: error
          archive: false
          path: |
            fabric-1201/build/libs/*.jar
            !fabric-1201/build/libs/*-dev-shadow.jar
            !fabric-1201/build/libs/*-sources.jar

      - name: Upload Forge 1.20.1 jar
        uses: actions/upload-artifact@v7
        with:
          name: resticrestorer-forge-1.20.1
          if-no-files-found: error
          archive: false
          path: |
            forge-1201/build/libs/*.jar
            !forge-1201/build/libs/*-dev-shadow.jar
            !forge-1201/build/libs/*-sources.jar

      - name: Upload Fabric 1.21.1 jar
        uses: actions/upload-artifact@v7
        with:
          name: resticrestorer-fabric-1.21.1
          if-no-files-found: error
          archive: false
          path: |
            fabric-1211/build/libs/*.jar
            !fabric-1211/build/libs/*-dev-shadow.jar
            !fabric-1211/build/libs/*-sources.jar

      - name: Upload NeoForge 1.21.1 jar
        uses: actions/upload-artifact@v7
        with:
          name: resticrestorer-neoforge-1.21.1
          if-no-files-found: error
          archive: false
          path: |
            neoforge-1211/build/libs/*.jar
            !neoforge-1211/build/libs/*-dev-shadow.jar
            !neoforge-1211/build/libs/*-sources.jar

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            fabric-1201/build/libs/*[!sources|dev-shadow].jar
            forge-1201/build/libs/*[!sources|dev-shadow].jar
            fabric-1211/build/libs/*[!sources|dev-shadow].jar
            neoforge-1211/build/libs/*[!sources|dev-shadow].jar
          fail_on_unmatched_files: false
          generate_release_notes: true
