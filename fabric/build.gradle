plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Exclude its transitive fabric-api pin: it requests a version newer than this project targets,
    // which otherwise drags in an incompatible fabric-api and breaks mod resolution at boot.
    modImplementation("me.lucko:fabric-permissions-api:0.3.1") {
        exclude group: "net.fabricmc.fabric-api"
    }
    include "me.lucko:fabric-permissions-api:0.3.1"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Route :core through the same "common" configuration :common uses, for consistency with forge (see
    // forge/build.gradle) — Fabric's Knot loader already saw it via `implementation`, but this keeps both
    // loaders' dev classpath wiring uniform.
    common project(':core')

    shadowBundle project(':core')
    shadowBundle 'com.rabbitmq:amqp-client:5.21.0'
    shadowBundle 'org.slf4j:slf4j-api:2.0.13' // amqp-client requires slf4j-api at runtime

    // Also make them present on the dev runtime classpath.
    implementation project(':core')
    implementation 'com.rabbitmq:amqp-client:5.21.0'
    implementation 'org.slf4j:slf4j-api:2.0.13'
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }

    // Fabric Loader resolves fabric.mod.json's "accessWidener" against this project's own resource
    // root in dev, not :common's (where the file actually lives) — copy it in alongside.
    from(rootProject.file('common/src/main/resources/resticrestorer.accesswidener'))
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
