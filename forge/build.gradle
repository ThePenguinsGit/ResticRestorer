plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig "resticrestorer.mixins.json"

        // Forge ignores Fabric access wideners at runtime, so convert our (common-module) access widener into
        // a Forge access transformer that IS applied on a production server. Without this, chunk entity/POI
        // writes — which reach the live IOWorkers through widened fields — throw IllegalAccessError on Forge.
        // It's listed as "extra" because the widener physically lives in :common's resources, not this module.
        convertAccessWideners = true
        extraAccessWideners.add "resticrestorer.accesswidener"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    // slf4j-api is excluded globally here: Forge (both in dev and in a real production launch) already
    // ships its own slf4j-api as a named JPMS module. Bundling a second copy makes ModLauncher's module
    // resolution hard-fail with "Modules resticrestorer and org.slf4j export package ... to module
    // minecraft/forge" — Forge's own copy satisfies amqp-client's requirement at runtime regardless.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // Forge's dev-run classpath (ModLauncher's restrictive classloader) only picks up jars reachable
    // through this "common" configuration, not plain `implementation` project deps — route :core (and its
    // transitive amqp-client) through it too so :forge:runServer/runClient can see it. slf4j-api is
    // excluded here for the same JPMS split-package reason as the shadowBundle configuration above.
    common(project(':core')) {
        exclude group: 'org.slf4j'
    }

    shadowBundle project(':core')
    shadowBundle 'com.rabbitmq:amqp-client:5.21.0'

    // Also make them present on the dev runtime/compile classpath (excluding slf4j-api, see above).
    implementation(project(':core')) {
        exclude group: 'org.slf4j'
    }
    implementation('com.rabbitmq:amqp-client:5.21.0') {
        exclude group: 'org.slf4j'
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
